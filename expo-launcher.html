<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimatna Dz - Expo Launcher Helper</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #06b6d4; /* Cyan */
      --primary-hover: #0891b2;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    h1 span {
      color: var(--primary);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: monospace;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
    }

    .qr-container {
      background-color: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 20px 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      min-height: 250px;
      min-width: 250px;
    }

    .qr-container img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Qimatna<span>Launcher</span></h1>
    <p>Bypass distorted terminal QR codes. Paste your local Expo URL below to generate a perfectly clean QR code and links for any iOS or Android device.</p>

    <div class="form-group">
      <label for="expo-url">Expo Server URL</label>
      <input type="text" id="expo-url" placeholder="e.g. exp://192.168.1.15:8081 or exp://u8-xyz...exp.direct" value="exp://192.168.1.">
    </div>

    <div class="qr-container">
      <img id="qr-image" src="" alt="Enter URL to generate QR code">
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="copyLink()">Copy URL</button>
      <a class="btn btn-primary" id="direct-link" href="#" target="_blank">Open in Browser</a>
    </div>
  </div>

  <div id="toast" class="toast">Link copied to clipboard!</div>

  <script>
    const urlInput = document.getElementById('expo-url');
    const qrImage = document.getElementById('qr-image');
    const directLink = document.getElementById('direct-link');
    const toast = document.getElementById('toast');

    function updateQR() {
      const url = urlInput.value.trim();
      if (!url) {
        qrImage.style.display = 'none';
        return;
      }
      qrImage.style.display = 'block';
      // Generate clean QR code using a high-quality QR code generator API
      qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(url)}`;
      
      // Update direct browser link (e.g. for web testing or sharing)
      directLink.href = url.replace('exp://', 'http://');
    }

    urlInput.addEventListener('input', updateQR);

    function copyLink() {
      const url = urlInput.value.trim();
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    }

    // Try to auto-fill IP if saved in localStorage
    const savedUrl = localStorage.getItem('last_expo_url');
    if (savedUrl) {
      urlInput.value = savedUrl;
    }
    
    urlInput.addEventListener('change', () => {
      localStorage.setItem('last_expo_url', urlInput.value);
    });

    updateQR();
  </script>
</body>
</html>
